# =============================================================================
# ЧЕК-ЛИСТ ПОД НОВОГО КЛИЕНТА — что реально нужно поменять при разворачивании
# на другую компанию (см. также PLAN.md):
#
#   1. Секция "КЛИЕНТ" ниже — название, точки, ссылки на площадки
#   2. tone_of_voice.md — переписать под голос нового бренда (шаблон структуры
#      можно оставить, содержание — нет)
#   3. clients/<slug>/.env — СВОИ TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID и APIFY_API_TOKEN
#      (не бот/аккаунт Жоржа и не бот/аккаунт предыдущего клиента — разный биллинг
#      Apify на разных клиентов). Корневой .env — только fallback для реально общих
#      ключей (PROXYAPI_KEY/GROQ_API_KEY), если один аккаунт LLM-провайдера на всех.
#   4. clients/<slug>/db/ — НЕ копировать от старого клиента, пусть создастся с нуля
#      (main_collect.py сам создаст пустую БД при первом запуске)
#   5. ПЕРВЫЙ сбор истории — ОБЯЗАТЕЛЬНО с флагом --backfill:
#      CLIENT_SLUG=<slug> python main_collect.py --backfill
#      Без флага следующий main_notify.py разошлёт карточку по КАЖДОМУ вставленному
#      отзыву одним пакетом (было на практике: 90 сообщений разом, 2026-07-09,
#      см. CHANGELOG). Это же касается любой ручной доливки старых отзывов в БД
#      в обход обычного цикла — не только самого первого запуска.
#   6. Секция "ШАБЛОН ПОД НИШУ" ниже — если новый клиент из ДРУГОЙ отрасли
#      (не фитнес-клуб) — переписать теги/категории полностью под его бизнес.
#      Если тоже фитнес — можно оставить как есть или точечно поправить.
#   7. Секция "ДВИЖОК" — можно стартовать с дефолтов (откалиброваны на первом
#      пилоте, разумные для большинства похожих бизнесов), пересмотреть после
#      1-2 месяцев реальных данных нового клиента — см. процесс в PLAN.md.
# =============================================================================


# =============================================================================
# КЛИЕНТ — обязательно поменять под нового
# =============================================================================
client:
  name: "SP Фитнес Вологда"
  locations:
    - id: leningradskaya97
      name: "SP Фитнес, ул. Ленинградская, 97Б"
      city: "Вологда"
      platforms:
        - type: 2gis
          url: "https://2gis.ru/vologda/search/SP/firm/70000001104500811"
          max_reviews: 10        # Apify тарифицируется за отзыв в выдаче — площадка совсем свежая (3 отзыва на момент подключения, 2026-07-27), запас на рост без переплаты
          lookback_days: 365     # низкий текущий объём отзывов — не резать историю коротким окном, иначе backfill почти ничего не соберёт
          poll_interval_hours: 24
        - type: yandex_maps
          url: "https://yandex.ru/maps/org/sp_fitnes_tsentr/43280875259"
        - type: zoon
          url: "https://zoon.ru/vologda/fitness/fitnes-tsentr_sp/"
      # Фламп/Справка.ру не добавлены — не проверено, есть ли клуб на этих площадках вообще.

tone_of_voice:
  source: document   # реальных ответов клуба в истории пока не видели — гипотеза, см. tone_of_voice.md
  path: "tone_of_voice.md"

notifications:
  telegram_chat_id: ""   # заполнить перед запуском (свой чат/бот на нового клиента, см. чек-лист выше)
  digest_time: "18:00"   # МСК; systemd timer настраивается отдельно (см. PLAN.md/README.md)


# =============================================================================
# ШАБЛОН ПОД НИШУ (фитнес-клубы) — адаптировано под формат клуба
# =============================================================================
#
# Сокращено относительно World Class/Даудель Спорт (2026-07-27): по сайту клуба
# (spfitness.ru) и объявлениям — тренажёрный зал + кардио + свободные веса +
# персональные тренировки на ~1000 м², один зал. Нет данных о бассейне, сауне/
# хамаме, групповых программах, детском клубе — эти теги/категории убраны, чтобы
# модель не пыталась подгонять под них реальные темы отзывов. Первая калибровка
# по реальным данным (см. чек-лист, п.7) может показать, что что-то из этого
# всё-таки есть — тогда доб авить обратно, не проектировать заранее вслепую.

categories:
  - name: "зона клуба"
    description: >
      Это КАТЕГОРИЯ, не тег — сама по себе не назначается отзыву напрямую, нужно
      выбрать конкретный тег внутри неё (раздевалка/душевые/интерьер/парковка).
      Общая физическая инфраструктура клуба, доступная всем посетителям бесплатно.
  - name: "персонал"
    description: >
      Люди, работающие в клубе. Тренеры — конкретно про тренировки/инструкторов.
      Администраторы — про ресепшн, запись, оплату. "Персонал" общего вида —
      только если роль явно не уточнена в отзыве.
  - name: "коммерция"
    description: >
      Деньги и условия покупки: стоимость (цена) и состав/доступность платных
      услуг (услуги), включая ограничения абонемента.
  - name: "сервис"
    description: >
      Качество исполнения процессов обслуживания, не привязанное к одной
      физической зоне (в первую очередь — чистота/уборка).
  - name: "оснащение"
    description: >
      Техническое состояние и исправность тренажёров/инвентаря, а также
      климат/воздух в помещениях (вентиляция, духота, влажность). НЕ включает
      ремонт, дизайн или эстетику помещений — это категория "зона клуба"
      (тег "интерьер").
  - name: "UX"
    description: >
      Субъективный опыт взаимодействия с клубом, не привязанный к конкретному
      месту или человеку: удобство расписания/записи, атмосфера/настроение,
      слаженность организации процессов в целом.
  - name: "гео"
    description: >
      Расположение клуба относительно города/района — внешняя география,
      не внутренняя структура клуба.

tags:
  - {name: "тренажёрный зал", category: "зона клуба", description: "Основной зал: тренажёры, свободные веса, планировка и теснота помещения (НЕ вентиляцию/климат — тег «вентиляция», и НЕ оборудование — тег «оборудование»)."}
  - {name: "тренеры", category: "персонал", description: "Работа конкретных тренеров, включая персональные тренировки. Слово «инструктор(а)» — синоним, тот же тег."}
  - {name: "администраторы", category: "персонал", description: "Работа ресепшена/администрации: запись, оплата, коммуникация, включая отказ помочь по факту обращения."}
  - {name: "персонал", category: "персонал", description: "Обслуживающий персонал общего вида, если роль не уточнена (не тренер и не администратор)."}
  - {name: "чистота", category: "сервис", description: "Уборка и гигиена в любых помещениях клуба."}
  - {name: "оборудование", category: "оснащение", description: "Техническое состояние, исправность, количество тренажёров/инвентаря (силовые/кардио/свободные веса)."}
  - {name: "вентиляция", category: "оснащение", description: "Климат, духота, влажность, качество воздуха в любом помещении клуба."}
  - {name: "wifi", category: "UX", description: "Wi-Fi и мобильная связь на территории клуба: доступность, стабильность, авторизация."}
  - {name: "раздевалка", category: "зона клуба", description: "Раздевалки и шкафчики в них."}
  - {name: "душевые", category: "зона клуба", description: "Душевые кабины."}
  - {name: "интерьер", category: "зона клуба", description: "Ремонт, дизайн, эстетика помещений — НЕ чистота и НЕ оборудование."}
  - {name: "парковка", category: "зона клуба", description: "Парковка при клубе."}
  - {name: "цена", category: "коммерция", description: "Стоимость абонементов/услуг."}
  - {name: "услуги", category: "коммерция", description: "Состав, наличие, доступность конкретных платных услуг — НЕ включает возврат денег (тег «возврат средств»)."}
  - {name: "возврат средств", category: "коммерция", description: "Возврат/компенсация денег за неиспользованный абонемент: сроки, отказ вернуть, задержки."}
  - {name: "расписание", category: "UX", description: "Удобство расписания/записи на тренировки, доступность окон под персональные тренировки."}
  - {name: "атмосфера", category: "UX", description: "Общее субъективное впечатление/настроение в клубе."}
  - {name: "организация", category: "UX", description: "Насколько слаженно организованы процессы в клубе в целом."}
  - {name: "информирование", category: "UX", description: "Клиента не предупредили заранее об условиях/доплатах/изменении правил. НЕ сам факт наличия доплаты/условия (это «услуги»/«цена»), а именно отсутствие предупреждения ЗАРАНЕЕ."}
  - {name: "локация", category: "гео", description: "Расположение клуба относительно города, удобство добираться."}
  # Стартовый словарь (2026-07-27), не откалиброван на реальных данных — см. чек-лист
  # выше, п.7. Новые теги, которые предложит модель при разборе первых отзывов,
  # попадают в tag_dictionary со статусом pending_review — утверждаются вручную
  # через дашборд (вкладка "Словарь тегов"), не автоматом.


# =============================================================================
# ДВИЖОК — общие технические дефолты, можно стартовать без изменений
# =============================================================================

collection:
  backfill_lookback_days: 365   # низкий текущий объём — тянем историю поглубже, не 180 дней как у первого пилота
  poll_interval_hours: 6

  watchdog_recent_days: 90
  watchdog_stale_cutoff_days: 180

alert_rules:
  default:
    - {window_days: 30, yellow_at: 3, red_at: 5}
    - {window_days: 90, yellow_at: 3, red_at: 6}
  overrides: {}
  # Пороги — те же дефолты, что у первого пилота (World Class). При таком низком
  # стартовом объёме отзывов алерты почти наверняка не сработают первое время —
  # это ожидаемо, не баг; пересмотреть после накопления реальных данных (см.
  # чек-лист выше, п.7), как и договаривались, не подгонять вслепую под 3 отзыва.

  chronic_tiers:
    - {window_days: 180, threshold: 6}
    - {window_days: 360, threshold: 9}
    - {window_days: 720, threshold: 14}

  repeat_offender:
    min_negative_count: 3
    window_days: 60
    renotify_after_days: 2
    max_notifications: 3

reply_sla_hours:
  negative: 24
  neutral: 72
  positive: null
